<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PПLTSAЯI 2: Russki Mir</title>
    <link rel="stylesheet" href="xterm.css">
    <style>
        :root { --bg: #0b0b0b; --fg: #e6e6e6; --red: #d52b1e; --muted: #777; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px 16px;
        }
        h1 { color: var(--red); font-size: 1.4em; letter-spacing: 3px; }
        .subtitle { color: var(--muted); font-size: 0.85em; margin-bottom: 8px; }
        #status { color: #ffaa00; margin: 6px 0; font-size: 0.85em; min-height: 1.2em; }
        .controls { margin-top: 10px; color: var(--muted); font-size: 0.78em; text-align: center; line-height: 2; max-width: 820px; }
        kbd { background: #1d1d1d; border: 1px solid #444; border-radius: 3px; padding: 1px 5px; color: #ddd; }
        #terminal-container {
            border: 2px solid #333;
            border-top-color: var(--red);
            background: #000;
            max-width: 100%;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>PПLTSAЯI 2</h1>
    <div class="subtitle">Russki Mir · Русский Мир</div>
    <div id="status">Yhdistetään...</div>
    <div id="terminal-container"></div>
    <div class="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> liiku (kävele päin = lyö / poimi / avaa) ·
        <kbd>Tab</kbd> tavarat: <kbd>W</kbd>/<kbd>S</kbd> valitse, <kbd>Q</kbd> käytä, <kbd>E</kbd> heitä ·
        tähtäys: <kbd>A</kbd>/<kbd>D</kbd> käännä, <kbd>Välilyönti</kbd> heitä/ammu, <kbd>Esc</kbd> peru ·
        <kbd>Z</kbd> lopeta
    </div>

    <script src="xterm.js"></script>
    <script>
        const status = document.getElementById('status');
        function setStatus(text, color) { status.textContent = text; status.style.color = color; }

        if (typeof Terminal === 'undefined') {
            setStatus('Terminaalikirjaston lataus epäonnistui.', '#ff4444');
            throw new Error('xterm missing');
        }

        const term = new Terminal({
            cols: 100,
            rows: 35,
            fontSize: 14,
            fontFamily: 'ui-monospace, "Cascadia Code", "Fira Code", "Courier New", monospace',
            theme: { background: '#000000', foreground: '#e6e6e6', cursor: '#d52b1e' },
            cursorBlink: false,
            scrollback: 0,
        });
        term.open(document.getElementById('terminal-container'));
        term.focus();

        let send = () => {};
        let transport = null;

        function connected(kind) {
            transport = kind;
            setStatus('Yhdistetty.', '#44ff44');
            setTimeout(() => { if (status.textContent === 'Yhdistetty.') setStatus('', ''); }, 2000);
            term.focus();
        }
        function ended() { setStatus('Yhteys päättyi. Päivitä sivu pelataksesi uudelleen.', '#ff4444'); }

        function startPolling() {
            fetch('api/new', { method: 'POST' })
                .then((r) => r.json())
                .then(({ id }) => {
                    connected('http');
                    let queue = '';
                    let sending = false;
                    send = (d) => {
                        queue += d;
                        if (sending) return;
                        sending = true;
                        const body = queue; queue = '';
                        fetch('api/input?id=' + id, { method: 'POST', body })
                            .finally(() => { sending = false; if (queue) send(''); });
                    };
                    (function poll() {
                        fetch('api/poll?id=' + id, { cache: 'no-store' })
                            .then((r) => (r.status === 204 ? { data: '' } : r.ok ? r.json() : Promise.reject()))
                            .then((m) => { if (m.data) term.write(m.data); if (m.done) ended(); else poll(); })
                            .catch(ended);
                    })();
                })
                .catch(() => setStatus('Ei yhteyttä palvelimeen, tai palvelin on täynnä.', '#ff4444'));
        }

        function startWebSocket() {
            const wsUrl = new URL('ws', location.href);
            wsUrl.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            let ws;
            try { ws = new WebSocket(wsUrl); } catch (e) { startPolling(); return; }
            const fallback = setTimeout(() => { ws.onclose = null; ws.close(); startPolling(); }, 3000);
            ws.onopen = () => {
                clearTimeout(fallback);
                connected('ws');
                send = (d) => { if (ws.readyState === WebSocket.OPEN) ws.send(d); };
            };
            ws.onmessage = (e) => term.write(e.data);
            ws.onclose = () => {
                clearTimeout(fallback);
                if (transport === 'ws') ended(); else if (!transport) startPolling();
            };
        }

        term.onData((d) => send(d));
        startWebSocket();
    </script>
</body>
</html>
