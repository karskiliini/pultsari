<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PПLTSAЯI 2: Russki Mir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #ff4444;
            margin: 12px 0 4px;
            font-size: 1.4em;
            letter-spacing: 3px;
        }
        .subtitle {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 8px;
        }
        #terminal-container {
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }
        .controls {
            margin-top: 8px;
            color: #666;
            font-size: 0.75em;
            text-align: center;
            line-height: 1.6;
        }
        .controls kbd {
            background: #222;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 1px 5px;
            color: #ccc;
        }
        #status {
            color: #ffaa00;
            margin: 6px 0;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1>PПLTSAЯI 2</h1>
    <div class="subtitle">Русский Мир</div>
    <div id="status">Yhdistetään...</div>
    <div id="terminal-container"></div>
    <div class="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> liiku &nbsp;|&nbsp;
        <kbd>E</kbd> poimi &nbsp;|&nbsp;
        <kbd>F</kbd> lyö &nbsp;|&nbsp;
        <kbd>R</kbd> heitä &nbsp;|&nbsp;
        <kbd>G</kbd> ammu &nbsp;|&nbsp;
        <kbd>I</kbd> inventaario &nbsp;|&nbsp;
        <kbd>Q</kbd> lopeta
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addons/fit/fit.addon.min.js"></script>
    <script>
        const term = new Terminal({
            cols: 100,
            rows: 35,
            fontSize: 14,
            fontFamily: '"Cascadia Code", "Fira Code", "Courier New", monospace',
            theme: {
                background: '#0a0a0a',
                foreground: '#e0e0e0',
                cursor: '#ff4444',
                cursorAccent: '#0a0a0a',
                red: '#ff4444',
                green: '#44ff44',
                yellow: '#ffaa00',
                blue: '#4488ff',
                magenta: '#ff44ff',
                cyan: '#44ffff',
                white: '#e0e0e0',
                brightRed: '#ff6666',
                brightGreen: '#66ff66',
                brightYellow: '#ffcc44',
                brightBlue: '#66aaff',
            },
            cursorBlink: true,
            scrollback: 0,
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        term.open(container);

        const status = document.getElementById('status');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        ws.onopen = () => {
            status.textContent = 'Yhdistetty! Peli käynnistyy...';
            status.style.color = '#44ff44';
            setTimeout(() => { status.style.display = 'none'; }, 2000);
            term.focus();
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        ws.onclose = () => {
            status.textContent = 'Yhteys katkesi. Päivitä sivu pelataksesi uudelleen.';
            status.style.color = '#ff4444';
            status.style.display = 'block';
        };

        ws.onerror = () => {
            status.textContent = 'Yhteysvirhe!';
            status.style.color = '#ff4444';
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        window.addEventListener('resize', () => fitAddon.fit());
    </script>
</body>
</html>
